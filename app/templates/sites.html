{% extends "base.html" %}
{% block title %}Sites{% endblock %}
{% block content %}
<div class="page">
  <div class="page-head">
    <h1>Sites</h1>
    {% if user.is_admin %}<a class="btn btn-primary" href="/sites/new">+ Add site</a>{% endif %}
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Site</th><th>Arming</th><th>Status</th><th>Open alarms</th><th>NX</th><th>Cameras</th><th>Last seen</th>{% if user.is_admin %}<th></th>{% endif %}</tr></thead>
      <tbody id="site-rows"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block scripts %}<script type="module" src="{{ asset('js/sites.js') }}"></script>{% endblock %}
