<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Alarm Portal{% endblock %} · TWG Security</title>
  <script>try { var t = localStorage.getItem("twg-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="brand" href="/">
    <span class="logo-chip"><img src="https://static.wixstatic.com/media/d4fc57_b28e915a1b924e33b12eb77028f74f62~mv2.png" alt="TWG Security" width="110" height="34"></span>
    <span class="brand-title">Alarm Portal</span>
  </a>
  <nav class="nav">
    <a href="/" class="{{ 'active' if page == 'map' }}">Map</a>
    <a href="/alarms" class="{{ 'active' if page == 'alarms' }}">Alarms <span id="nav-alarm-count" class="badge" hidden>0</span></a>
    <a href="/sites" class="{{ 'active' if page == 'sites' }}">Sites</a>
    <a href="/audit" class="{{ 'active' if page == 'audit' }}">Audit log</a>
    {% if user.is_admin %}<a href="/users" class="{{ 'active' if page == 'users' }}">Users</a>{% endif %}
  </nav>
  <div class="topbar-actions">
    <button id="mute-toggle" class="btn icon-btn" type="button" title="Mute alarm sound" aria-label="Mute alarm sound">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path class="sound-on" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="sound-off" d="m16 9 6 6m0-6-6 6" hidden/></svg>
    </button>
    <button id="theme-toggle" class="btn icon-btn" type="button" title="Toggle light/dark" aria-label="Toggle light or dark theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <span class="user-label">{{ user.label }}</span>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="btn btn-sm" type="submit">Sign out</button>
    </form>
  </div>
</header>
{% endif %}
<main>{% block content %}{% endblock %}</main>

<div id="toast-root" aria-live="polite"></div>
<dialog id="ack-dialog">
  <form method="dialog" id="ack-form">
    <h2>Acknowledge alarm</h2>
    <p id="ack-summary" class="muted"></p>
    <div class="field">
      <label for="ack-note">Disposition note</label>
      <textarea id="ack-note" maxlength="4000" placeholder="What did you see / do? (e.g. verified on camera, false alarm — wildlife)"></textarea>
    </div>
    <div class="dialog-actions">
      <button class="btn" value="cancel" type="button" id="ack-cancel">Cancel</button>
      <button class="btn btn-primary" value="ok" type="submit" id="ack-submit">Acknowledge</button>
    </div>
  </form>
</dialog>

{% if user %}
<script>window.PORTAL = {{ {"user": user.label, "isAdmin": user.is_admin, "mapsKey": maps_api_key, "mapId": maps_map_id} | tojson }};</script>
<script type="module" src="/static/js/common.js"></script>
{% endif %}
{% block scripts %}{% endblock %}
</body>
</html>
