{% extends "base.html" %}
{% block title %}Alarms{% endblock %}
{% block content %}
<div class="page">
  <div class="page-head"><h1>Alarms</h1><span class="muted" id="alarm-count"></span></div>
  <div class="filters">
    <div class="seg" id="state-seg" role="group" aria-label="State">
      <button type="button" data-state="open" class="active">Open</button>
      <button type="button" data-state="acknowledged">Acknowledged</button>
      <button type="button" data-state="disarmed" title="Security events received while the site was disarmed (not raised)">While disarmed</button>
      <button type="button" data-state="all">All</button>
    </div>
    <select id="f-site" aria-label="Site"><option value="">All sites</option></select>
    <select id="f-priority" aria-label="Level">
      <option value="">All levels</option><option value="1">Critical</option><option value="2">Alarm</option><option value="3">Warning</option>
    </select>
    <input type="search" id="f-q" placeholder="Search caption, camera, description" aria-label="Search">
  </div>
  <ul class="alarm-list" id="alarm-list"><li class="empty">Loading…</li></ul>
  <div class="list-footer"><button class="btn" id="load-more" hidden>Load more</button></div>
</div>
{% endblock %}
{% block scripts %}<script type="module" src="/static/js/alarms.js"></script>{% endblock %}
