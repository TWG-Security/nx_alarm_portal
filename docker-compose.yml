# App + Postgres + Caddy (HTTPS). Secrets come from .env (see .env.example).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: nx-alarm-portal:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://portal:${POSTGRES_PASSWORD}@db:5432/portal
    volumes:
      - tilecache:/app/tile-cache
      - mediacache:/app/media-cache
      - sitemodels:/app/site-models     # uploaded 3D models + their 3D Tiles (not in tools/backup.sh: re-upload)
      - ./secrets:/app/secrets:ro       # Apple's APNs key (tools/install_apns_key.sh): not in git, not in the backups
    depends_on:
      db:
        condition: service_healthy

  # Camera image health (app/camhealth/worker.py): its own process and image (PyTorch + the NVIDIA card), capped at
  # 1.5 CPUs and niced, so it can never slow the alarm pipeline in `app`. Reads frames from NX, writes camera_health.
  vision:
    build:
      context: .
      dockerfile: Dockerfile.vision
    image: nx-alarm-vision:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://portal:${POSTGRES_PASSWORD}@db:5432/portal
      CAMHEALTH_DIR: /app/camhealth-data
      NVIDIA_DRIVER_CAPABILITIES: compute,utility         # utility: NVML numbers for TWG's processing panel
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True   # 4 GB card: less fragmentation between the models
    volumes:
      - camhealth:/app/camhealth-data   # per-time-of-day frame library (relearns by itself: not in the backups)
    cpus: 1.5
    mem_limit: 3g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      app:
        condition: service_healthy      # migrations have run

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PORTAL_HOST: ${PORTAL_HOST:-10.1.10.97}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  tilecache:
  mediacache:
  sitemodels:
  camhealth:
  caddy_data:
  caddy_config:
